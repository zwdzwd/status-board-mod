<title>Status Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: foldable sections by kind of work (Papers, Software, Misc), each a grid of fixed-size cards in a stable order (priority, then name). Each card: name, one line of where it stands, next step, blocker, and one button per thread. Thread colors come live from each thread's session when its id is on the card; the card's own status follows its threads. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --fg:#14202a; --muted:#5b6b78; --line:#d9e0e5; --accent:#0f6e7a; --accent-soft:#e1f0f1;
  --think:#2563a8; --think-soft:#e3ecf8; --ok:#2f8a4e; --ok-soft:#e3f3e8; --warn:#b7791f; --warn-soft:#fbf0dc; --bad:#c2410c; --bad-soft:#fde8dd; --idle:#7b8794; --idle-soft:#eceff2;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --card-h:108px; /* every card is this tall; longer text is clipped, full text in the hover card */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --panel:#17212a; --fg:#e4ebef; --muted:#93a3ae; --line:#2a3743; --accent:#4fb8c4; --accent-soft:#163238;
  --think:#6ea8f0; --think-soft:#16263a; --ok:#5cc47f; --ok-soft:#163223; --warn:#e3a94a; --warn-soft:#352a14; --bad:#f07a45; --bad-soft:#3a1e12; --idle:#8d9aa6; --idle-soft:#222d36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --panel:#17212a; --fg:#e4ebef; --muted:#93a3ae; --line:#2a3743; --accent:#4fb8c4; --accent-soft:#163238;
  --think:#6ea8f0; --think-soft:#16263a; --ok:#5cc47f; --ok-soft:#163223; --warn:#e3a94a; --warn-soft:#352a14; --bad:#f07a45; --bad-soft:#3a1e12; --idle:#8d9aa6; --idle-soft:#222d36; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4vw,30px);line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:5px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.go:hover{filter:brightness(1.08);color:var(--panel)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.s-thinking .dot{background:var(--think)} .s-working .dot{background:var(--ok)} .s-waiting .dot{background:var(--bad)} .s-blocked .dot{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.live .ldot{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.live.on .ldot{background:var(--ok)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump a{font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px}
.jump a:hover{border-color:var(--accent);color:var(--accent)}
.jump a .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);margin-left:5px}
#board{display:flex;flex-direction:column;gap:26px}
.section{display:flex;flex-direction:column;gap:10px}
.section>.grid,.section>.sec-empty{margin-top:10px}
.sec-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;cursor:pointer;list-style:none;user-select:none}
.sec-head::-webkit-details-marker{display:none}
.sec-head::before{content:"";width:0;height:0;border-left:6px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;align-self:center;transition:transform .15s}
.section[open]>.sec-head::before{transform:rotate(90deg)}
.sec-head:hover h2{color:var(--accent)}
.sec-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec-head .sum-dots{display:inline-flex;gap:8px;margin-left:auto;font-size:12px;color:var(--muted)}
.sec-head .sum-dots span{display:inline-flex;align-items:center;gap:4px}
.sec-head h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
.sec-head .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec-empty{font-size:13px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:minmax(var(--card-h),auto);gap:6px;align-items:stretch}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 7px;display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden;min-width:0;min-height:var(--card-h);box-sizing:border-box}
.top{display:flex;align-items:baseline;gap:6px}
.top h3{font-family:var(--f-display);font-weight:700;font-size:13.5px;line-height:1.2;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{margin:0;font-size:11.5px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;flex-shrink:0}
.line.sum{-webkit-line-clamp:2}
.line b{font-weight:700;font-size:10px;color:var(--muted);margin-right:4px}
.line.next,.line.next b{color:var(--ok)}
.line.bad,.line.bad b{color:var(--bad)}
.card.open{background:var(--idle-soft);border-color:var(--accent)}
.body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.threads{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;padding-top:2px}
.text{min-width:0;display:flex;flex-direction:column;gap:2px}
#tip .threads{gap:4px;margin-top:2px;pointer-events:auto}
.tbtn{font-size:11px;font-weight:500;line-height:1.3;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:3px;padding:1px 5px;text-decoration:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tbtn:hover{border-color:var(--accent)}
.tbtn.more{color:var(--muted);background:transparent;border-color:var(--line);cursor:default}
/* Thread buttons take their thread's own status color; a thread with no status stays neutral. */
.tbtn.t-thinking{color:var(--think);background:var(--think-soft)} .tbtn.t-thinking:hover{border-color:var(--think)}
.tbtn.t-working{color:var(--ok);background:var(--ok-soft)} .tbtn.t-working:hover{border-color:var(--ok)}
.tbtn.t-waiting{color:var(--bad);background:var(--bad-soft)} .tbtn.t-waiting:hover{border-color:var(--bad)}
.tbtn.t-idle{color:var(--idle);background:var(--idle-soft)} .tbtn.t-idle:hover{border-color:var(--idle)}
.tbtn.t-ended{color:var(--muted);background:transparent;border:1px dashed var(--line);opacity:.7}
.tbtn .tdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:1px;box-sizing:border-box}
.tbtn.stale{border:1px dashed currentColor;opacity:.75}
.tbtn.t-thinking .tdot,.tbtn.t-working .tdot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.tbtn.t-thinking .tdot,.tbtn.t-working .tdot{animation:none}}
.meta{font-family:var(--f-mono);font-size:10px;color:var(--muted);flex-shrink:0;white-space:nowrap}
.muted{color:var(--muted)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:24px;color:var(--muted);text-align:center}
/* Hover card: the full text of a card, shown next to it. */
#tip{position:fixed;z-index:30;pointer-events:auto;width:min(380px,calc(100vw - 24px));background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
#tip h4{font-family:var(--f-display);font-size:16px;margin:0}
#tip p{margin:0;overflow-wrap:anywhere}
#tip b{display:block;font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#tip .bad,#tip .bad b{color:var(--bad)} #tip .next,#tip .next b{color:var(--ok)}
#tip .meta{margin:0}
.skillbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.skillbox pre{margin:0;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;user-select:all}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Status Board</h1>
      <p class="sub" id="sub">Every project at a glance.</p>
    </div>
    <div class="hbtns"><a class="btn" href="https://github.com/zwdzwd/status-board-mod#setting-up" target="_blank" rel="noopener" title="How to install the plugin on a new machine or account">Setup</a><button class="btn" id="skillBtn" type="button" disabled title="Copy a prompt that sets up your update-status-board skill with this board's link">Copy skill setup</button></div>
  </header>

  <div class="legend" aria-label="Thread colors"><span class="s-thinking"><span class="dot"></span>Thinking (Claude is on it)</span><span class="s-working"><span class="dot"></span>Working (a job is running)</span><span class="s-waiting"><span class="dot"></span>Waiting on you</span><span class="s-idle"><span class="dot"></span>Idle</span></div>
  <div class="live" id="live" hidden><span class="ldot"></span><span id="liveText"></span></div>

  <div id="board" aria-live="polite">
    <div class="empty">Loading projects…</div>
  </div>

  <div id="skillBox" class="skillbox" hidden><p class="muted">Copying was blocked here. Select the text below and copy it, then paste it into any Claude session.</p><pre id="skillText"></pre></div>
  <div id="tip" hidden role="tooltip"></div>
</div>

<script>
(function(){
  const STATUS = {
    waiting:{label:"Waiting on you",rank:0}, thinking:{label:"Thinking",rank:1}, working:{label:"Working",rank:2},
    idle:{label:"Idle",rank:3}
  };
  // Sections, in page order. A card's "category" picks its section; cards without one go to Papers.
  // Grants, talks and personal work share one section, Misc.
  const SECTIONS = [{key:"paper", label:"Papers"}, {key:"software", label:"Software"}, {key:"misc", label:"Misc"}];
  const CAT_ALIAS = {papers:"paper", research:"paper", tool:"software", tools:"software", code:"software",
    grant:"misc", grants:"misc", talk:"misc", talks:"misc", personal:"misc", other:"misc"};
  const catKey = c => { const k = String(c || "").toLowerCase().trim(); const a = CAT_ALIAS[k] || k; return SECTIONS.some(s => s.key === a) ? a : "paper"; };
  // Cards written before the switch to Claude Code's buckets keep rendering.
  const LEGACY = {waiting_on_you:"waiting", blocked:"waiting", at_risk:"waiting", on_track:"working", paused:"idle", done:"idle"};
  const stKey = s => STATUS[s] ? s : (LEGACY[s] || "idle");
  // A thread session's live bucket, as Claude Code Remote reports it.
  const BUCKET = {WORKING:"thinking", BLOCKED:"waiting", REVIEW_READY:"waiting", FAILED:"waiting", COMPLETED:"idle"};
  const CCR = "Claude Code Remote";
  const VERSION = "0.9.4";
  let boardLink = "";
  function skillPrompt(link){
    return [
      'Set up my personal skill "update-status-board" so every session knows where my Status Board is. Save it with exactly the content below. If a skill with that name exists and cannot be updated in place, remove it and save this one as new. If you cannot save skills in this session, show me the content so I can add it under Customize, Skills.',
      '',
      '---',
      'name: update-status-board',
      "description: Update this project's card on Wanding's Status Board, or find the board's address.",
      '---',
      '# Status Board',
      'The Status Board is the artifact ' + link + '. Read and write it with the ArtifactData tool.',
      'Its rules are the "rules" field of collection meta, doc_id instruction. Read them first and',
      'follow them; they are the only description of the card format.',
      "To update this project's card, follow those rules and write only this project's card.",
      'If the board does not answer, tell the user in one line that the Status Board link in this',
      'skill no longer works.'
    ].join("\n");
  }   // one version for board, mod and rules; bump all three together
  let projects = [];
  let mcp = null; const live = {}, watches = {};
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, ...kids) => { const n = document.createElement(tag);
    if (attrs) for (const k in attrs){ if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
    for (const k of kids) if (k != null) n.append(k); return n; };
  const arr = v => Array.isArray(v) ? v.filter(x => x != null && x !== "") : (v ? [v] : []);
  const safe = u => typeof u === "string" && /^https:\/\//.test(u);
  const first = v => Array.isArray(v) ? arr(v)[0] : (typeof v === "string" ? v : "");
  // Thread entries may carry the session id as session_… or cse_…; get_session takes session_….
  const sid = t => { const s = t && typeof t.session === "string" ? t.session.trim() : "";
    return /^(session|cse)_[A-Za-z0-9]+$/.test(s) ? s.replace(/^cse_/, "session_") : ""; };

  function ago(iso){
    if (!iso) return "never";
    const t = Date.parse(iso); if (isNaN(t)) return "";
    const d = (Date.now() - t) / 86400000;
    if (d < 1/24) return "just now";
    if (d < 1) return Math.round(d*24) + "h ago";
    if (d < 14) return Math.round(d) + "d ago";
    return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  }

  // A thread's state. "status" is the chat itself: thinking (Claude is on a turn), waiting on you, or idle.
  // "job" is a machine job the thread started (SLURM, CI, a build): while one is set, an idle chat shows as working.
  // Thinking beats working, since a thinking thread can take something else only once it is done.
  function threadState(t){
    const L = live[sid(t)];
    // "working" is written while a command runs on a machine (the mod) or a job is running (the rules).
    const raw = t.status ? stKey(t.status) : "";
    const job = (typeof t.job === "string" && t.job.trim()) || "";
    let S = raw ? {key:raw, live:false, note:""} : (job ? {key:"idle", live:false, note:""} : null);
    const fresh = t.at && (Date.now() - Date.parse(t.at)) < 3*3600000;
    if (L && L.key === "thinking") S = {key:"thinking", live:true, note:L.note};
    else if (S && S.key === "thinking" && fresh) { /* keep the stored thinking */ }
    else if (L && L.key) S = {key:L.key, live:true, note:L.note};
    if (S && S.key === "idle" && job) S = {key:"working", live:S.live, note:job === "a job" ? "" : job};
    return S;
  }
  const endedAfterAt = t => t.ended && (!t.at || Date.parse(t.ended) >= Date.parse(t.at) - 1000);
  const ORDER = ["waiting","thinking","working","idle"];
  function cardKey(p){
    const ks = arr(p.threads).filter(Boolean).map(threadState).filter(Boolean).map(s => s.key);
    for (const k of ORDER) if (ks.includes(k)) return k;
    return stKey(p.status);
  }
  // Which sections are folded is remembered per browser.
  let folded = new Set();
  try { folded = new Set(JSON.parse(localStorage.getItem("sb-folded") || "[]")); } catch(e){}
  function saveFolded(){ try { localStorage.setItem("sb-folded", JSON.stringify([...folded])); } catch(e){} }
  // A stored "thinking" with no update for 3+ hours is probably stale (live statuses never are).
  const staleWork = (t, s) => s && !s.live && s.key === "thinking" && t.at && (Date.now() - Date.parse(t.at)) > 3*3600000;

  function card(p){
    const c = el("article",{class:"card","data-id":p.id});
    const top = el("div",{class:"top"}, el("h3",{text:p.name||p.id}), el("span",{class:"meta",text:ago(p.updated)}));
    if (safe(p.url)) top.append(el("a",{class:"btn go",href:p.url,target:"_blank",rel:"noopener",title:"Open this project in Claude",text:"Open ↗"}));
    c.append(top);
    // Body: summary / next / blockers, then the thread buttons along the bottom (at most 4, then "… +N").
    const body = el("div",{class:"body"}); c.append(body);
    const all = arr(p.threads).filter(t => t && (safe(t.url) || t.label));
    const r = el("div",{class:"threads"});
    const shown = all.length > 4 ? all.slice(0, 3) : all;
    shown.forEach(t => r.append(threadButton(t)));
    if (all.length > 4) r.append(el("span",{class:"tbtn more",title:all.slice(3).map(t => t.label||"Thread").join(", ") + " — hover the card for all " + all.length,text:"\u2026 +" + (all.length - 3)}));
    if (!all.length) r.append(el("span",{class:"line muted",text:"No threads"}));
    const txt = el("div",{class:"text"}); body.append(txt);
    if (p.summary) txt.append(el("p",{class:"line sum",text:p.summary}));
    const nx = first(p.next); if (nx) txt.append(el("p",{class:"line next"}, el("b",{text:"N",title:"Next"}), nx));
    const bl = asks(p)[0] || first(p.blocker) || first(p.blockers); if (bl) txt.append(el("p",{class:"line bad"}, el("b",{text:"W",title:"Waiting on you"}), bl));
    if (!p.summary && !nx && !bl) txt.append(el("p",{class:"line muted",text:"No update yet."}));
    body.append(r);
    hookTip(c, p);
    return c;
  }

  // ---- Hover card with the full text ----
  let tipTimer = null, tipFor = null;
  // What the chats waiting on you ask for, as "Label: request" (the plugin writes it with the status).
  function asks(p){
    return arr(p.threads).filter(t => t && typeof t.waiting === "string" && t.waiting.trim() && (threadState(t) || {}).key === "waiting")
      .sort((a, b) => String(b.at || "").localeCompare(String(a.at || ""))).map(t => (t.label || "Thread") + ": " + t.waiting.trim());
  }
  function fillTip(p){
    const t = $("tip"); t.replaceChildren(el("h4",{text:p.name||p.id}));
    if (p.summary) t.append(el("p",{text:p.summary}));
    const nx = arr(p.next); if (nx.length) t.append(el("p",{class:"next"}, el("b",{text:"Next"}), nx.join(" · ")));
    const bl = asks(p).concat(first(p.blocker) ? [p.blocker] : arr(p.blockers)); if (bl.length){ const w = el("div",{class:"bad"}, el("b",{text:"Waiting on you"})); bl.forEach(x => w.append(el("p",{text:x}))); t.append(w); }
    if (!p.summary && !nx.length && !bl.length) t.append(el("p",{class:"muted",text:"No update yet."}));
    const all = arr(p.threads).filter(x => x && (safe(x.url) || x.label));
    if (all.length){ const r = el("div",{class:"threads"}); all.forEach(x => r.append(threadButton(x))); t.append(el("p",null, el("b",{text:"Threads (" + all.length + ")"})), r); }
    t.append(el("p",{class:"meta",text:"Updated " + ago(p.updated) + (p.updatedBy ? " · " + p.updatedBy : "")}));
  }
  function placeTip(card){
    const t = $("tip"), r = card.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = 8;
    t.hidden = false; const tw = t.offsetWidth, th = t.offsetHeight;
    let x = r.right + g, y = r.top;
    if (x + tw > W - g) x = r.left - g - tw;            // no room on the right: go left
    if (x < g){ x = Math.min(Math.max(g, r.left), W - tw - g); y = r.bottom + g;   // no room either side: go below
      if (y + th > H - g) y = r.top - g - th; }       // or above
    y = Math.min(Math.max(g, y), Math.max(g, H - th - g));
    t.style.left = x + "px"; t.style.top = y + "px";
  }
  let openId = null;   // which project's panel is open; survives re-renders from live updates
  function showTip(card, p){ clearTimeout(tipTimer); if (tipFor) tipFor.classList.remove("open"); tipFor = card; openId = p.id; card.classList.add("open"); fillTip(p); placeTip(card); }
  function hideTip(){ clearTimeout(tipTimer); if (tipFor) tipFor.classList.remove("open"); tipFor = null; openId = null; $("tip").hidden = true; }
  // Click a card (not a button) to open its full text; click it again, click elsewhere, or press Esc to close.
  function hookTip(c, p){
    c.addEventListener("click", e => { if (e.target.closest("a,button")) return; if (tipFor === c && !$("tip").hidden) hideTip(); else showTip(c, p); });
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
  document.addEventListener("click", e => { if (!e.target.closest(".card")) hideTip(); });
  addEventListener("resize", hideTip);

  function threadButton(t){
    const s = threadState(t), tk = s ? s.key : "", stale = staleWork(t, s);
    const when = t.ended && endedAfterAt(t) ? "session ended " + ago(t.ended) : (t.at ? "last activity " + ago(t.at) : "no activity recorded");
    if (!safe(t.url)) return el("span",{class:"tbtn" + (tk ? " t-" + tk : ""),title:"Link not set yet. " + when,text:(t.label||"Thread")});
    const tip = "Open this thread in Claude" + (tk ? " (" + STATUS[tk].label.toLowerCase() + (s.live ? ", live" : (t.at ? ", reported " + ago(t.at) : ", as of the last card update")) + (stale ? "; no update for 3h+, may be stale" : "") + ")" : "") + (s && s.note ? "\n" + s.note : "") + (tk === "waiting" && typeof t.waiting === "string" && t.waiting ? "\nWaiting on you: " + t.waiting : "");
    return el("a",{class:"tbtn" + (tk ? " t-" + tk : "") + (stale ? " stale" : ""),href:t.url,target:"_blank",rel:"noopener",title:tip,"aria-label":(t.label||"Thread") + (tk ? ", " + STATUS[tk].label : "")}, tk ? el("span",{class:"tdot"}) : null, (t.label||"Thread"));
  }

  function render(){
    const keep = openId; tipFor = null; $("tip").hidden = true;
    const b = $("board"); b.replaceChildren();
    const pr = {high:0, medium:1, low:2};
    if (!projects.length){ b.append(el("div",{class:"empty",text:"No projects yet. Say “update the board” inside any Claude project."})); }
    else SECTIONS.forEach(sec => {
      const rows = projects.filter(p => catKey(p.category) === sec.key)
        .sort((a,b) => (pr[a.priority] ?? 1) - (pr[b.priority] ?? 1) || String(a.name||a.id).localeCompare(String(b.name||b.id), undefined, {sensitivity:"base"}));
      const id = "sec-" + sec.key;
      // Folded sections show a status tally in their header so nothing urgent hides.
      const tally = {}; rows.forEach(p => { const k = cardKey(p); tally[k] = (tally[k]||0) + 1; });
      const dots = el("span",{class:"sum-dots"});
      ["waiting","working"].forEach(k => { if (tally[k]) dots.append(el("span",{class:"s-"+k}, el("span",{class:"dot"}), tally[k] + " " + STATUS[k].label.toLowerCase())); });
      const s = el("details",{class:"section",id:id},
        el("summary",{class:"sec-head"}, el("h2",{text:sec.label}), el("span",{class:"n",text:String(rows.length)}), dots));
      s.open = !folded.has(sec.key);
      s.addEventListener("toggle", () => { if (s.open) folded.delete(sec.key); else folded.add(sec.key); saveFolded(); });
      if (rows.length){ const g = el("div",{class:"grid"}); rows.forEach(p => g.append(card(p))); s.append(g); }
      else s.append(el("p",{class:"sec-empty",text:"Nothing here yet."}));
      b.append(s);
    });
    const stale = projects.filter(p => !p.updated || (Date.now()-Date.parse(p.updated))/86400000 > 14).length;
    if (keep){ const p = projects.find(x => x.id === keep); const c = p && document.querySelector('#board .card[data-id="' + CSS.escape(keep) + '"]'); if (p && c) showTip(c, p); else openId = null; }
    $("sub").textContent = projects.length ? projects.length + " project" + (projects.length===1?"":"s") + (stale ? " · " + stale + " not updated in 2+ weeks" : "") + " · v" + VERSION : "Every project at a glance. v" + VERSION;
  }

  // ---- Live thread status ----
  let liveIssue = "", approvalBtn = null;
  function setLive(text, on){
    const box = $("live"); box.classList.toggle("on", !!on); $("liveText").textContent = text;
    if (approvalBtn && liveIssue !== "approval_required"){ approvalBtn.remove(); approvalBtn = null; }
  }
  function liveSummary(){
    const ids = Object.keys(watches), got = ids.filter(i => live[i] && live[i].key).length;
    if (!mcp) return;
    if (liveIssue === "needs_reauth") return setLive("Live thread status is off: reconnect Claude Code Remote in claude.ai Settings → Connectors.", false);
    if (liveIssue === "server_not_connected") return setLive("Live thread status is off: add the Claude Code Remote connector in claude.ai Settings → Connectors.", false);
    if (liveIssue === "not_allowed") return setLive("Live thread status is off for this page (Claude Code Remote was not allowed; " + (lastNote || "no code") + ").", false);
    if (liveIssue === "approval_required"){
      setLive("Live thread status needs your approval.", false);
      if (!approvalBtn){ approvalBtn = el("button",{class:"btn",type:"button",text:"Allow live status"});
        approvalBtn.onclick = async () => { const first = ids[0]; if (!first) return;
          try { const r = await mcp.callTool(CCR, "get_session", {session_id:first}); apply(first, r); liveIssue = ""; liveSummary(); render(); }
          catch(e){ liveIssue = e && e.code === "approval_required" ? "approval_required" : "not_allowed"; liveSummary(); } };
        $("live").append(approvalBtn); }
      return;
    }
    if (!ids.length) return setLive("Live thread status: no thread on the board has a session id yet; colors come from the last card update.", false);
    setLive("Live thread status on for " + got + " of " + ids.length + " threads. Others show the last card update." + (got < ids.length && lastNote ? " Last problem: " + lastNote + "." : ""), got > 0);
  }
  function record(result){
    const tryParse = x => { if (typeof x !== "string") return x; try { return JSON.parse(x); } catch(e){ const m = x.match(/\{[\s\S]*\}/); if (m) try { return JSON.parse(m[0]); } catch(e2){} } return null; };
    const cands = [result && result.payload, result && result.structuredContent];
    (result && result.content || []).forEach(c => { if (c && c.type === "text") cands.push(c.text); });
    for (let c of cands){ c = tryParse(c); if (!c || typeof c !== "object") continue;
      for (const r of [c, c.ccr, c.session, c.data]) if (r && typeof r === "object" && (r.status_bucket || r.session_status)) return r; }
    return null;
  }
  let lastNote = "";
  function apply(id, result){
    const s = record(result);
    if (!s){ lastNote = "unexpected reply shape"; return; }
    const b = String(s.status_bucket || "").replace(/^SESSION_STATUS_BUCKET_/i, "").toUpperCase();
    let key = BUCKET[b] || "";
    if (/ARCHIVED/i.test(String(s.session_status || ""))) key = "idle";
    if (!key){ lastNote = "unknown status " + (s.status_bucket || s.session_status || "none"); return; }
    const pts = s.post_turn_summary || (s.external_metadata && s.external_metadata.post_turn_summary) || {};
    const note = key === "waiting" ? (pts.needs_action || pts.status_detail || "") : (pts.status_detail || "");
    live[id] = {key, note: typeof note === "string" ? note : ""};
  }
  function watch(id){
    if (watches[id] || !mcp) return;
    watches[id] = mcp.watchTool(CCR, "get_session", {session_id:id}, ev => {
      if (ev.type === "data"){ apply(id, ev.result); if (liveIssue === "approval_required") liveIssue = ""; }
      else { const code = ev.error && ev.error.code; lastNote = "error " + (code || "unknown");
        if (["needs_reauth","server_not_connected","selection_required","blocked_by_policy","not_in_manifest","approval_required","not_granted","capability_disabled","capability_removed"].includes(code)){
          delete live[id];
          liveIssue = code === "approval_required" ? "approval_required" : code === "needs_reauth" ? "needs_reauth" : code === "server_not_connected" || code === "selection_required" ? "server_not_connected" : "not_allowed";
        }
      }
      liveSummary(); render();
    }, {refetchInterval: 30000});
  }
  function syncWatches(){
    if (!mcp) return;
    const want = new Set(); projects.forEach(p => arr(p.threads).forEach(t => { const i = sid(t); if (i) want.add(i); }));
    want.forEach(watch);
    Object.keys(watches).forEach(i => { if (!want.has(i)){ watches[i](); delete watches[i]; delete live[i]; } });
    liveSummary();
  }

  $("skillBtn").onclick = async () => {
    if (!boardLink) return;
    const text = skillPrompt(boardLink), btn = $("skillBtn");
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy skill setup", 1600); $("skillBox").hidden = true; }
    catch (e) { $("skillText").textContent = text; $("skillBox").hidden = false; }
  };

  (async function start(){
    claude.use("mcp").then(m => { mcp = m;
      if (!mcp) $("live").hidden = true;
      else syncWatches(); });
    const db = await claude.use("db");
    if (!db){ $("board").replaceChildren(el("div",{class:"empty",text:"Sign in to claude.ai to see your status board."})); return; }
    db.collection("projects").onSnapshot(snap => {
      projects = snap.docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data()));
      // Threads still on the old rule write only the card's status; color those threads from it.
      projects.forEach(p => { if (p.status) p.threads = arr(p.threads).map(t => t && !t.status ? Object.assign({}, t, {status:p.status, at:t.at || p.updated}) : t); });
      syncWatches(); render();
    }, err => { $("board").replaceChildren(el("div",{class:"empty",text:"The board couldn't load (" + (err && err.code || "error") + "). Reload the page to try again."})); });
    // The board's own link is kept in its data (meta/instruction.board): a page cannot read its own
    // address. "Copy skill setup" builds the prompt from it, so a rebuilt board hands out its new link.
    db.doc("meta/instruction").onSnapshot(s => {
      const d = s.exists ? s.data() : null;
      boardLink = d && typeof d.board === "string" && /^https:\/\/claude\.ai\/(code\/)?artifact\/[A-Za-z0-9-]+$/.test(d.board) ? d.board : "";
      $("skillBtn").disabled = !boardLink;
      $("skillBtn").title = boardLink ? "Copy a prompt that sets up your update-status-board skill with this board's link" : "This board's link is not recorded yet (meta/instruction.board)";
    }, () => {});
    setInterval(() => { if (projects.length) render(); }, 60000);
  })();
})();
</script>
