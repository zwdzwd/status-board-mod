<title>Status Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a quiet ledger. Sections stack; inside each, project panels flow in newspaper columns in a stable
   order (priority, name). Each panel lists its threads one per line behind a square marker: solid red
   when the thread waits on you, a faint ring otherwise. Red is the only loud colour on the page. Hover a red line to see what it waits on. */
:root{
  --bg:#f2f3f6; --panel:#fff; --fg:#1a1e29; --fg2:#4a5163; --muted:#737a8c; --line:#e2e5ec; --hover:#eef0f5;
  --red:#cf2f27; --red-fg:#fff; --red-soft:#fdecea; --dot:#2b6fd6;
  --f:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --panel:#171a22; --fg:#e7e9ef; --fg2:#b3b9c7; --muted:#858c9d; --line:#272b37; --hover:#1f232e;
  --red:#f05a4c; --red-fg:#fff; --red-soft:#3a1916; --dot:#6ea3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1116; --panel:#171a22; --fg:#e7e9ef; --fg2:#b3b9c7; --muted:#858c9d; --line:#272b37; --hover:#1f232e;
  --red:#f05a4c; --red-fg:#fff; --red-soft:#3a1916; --dot:#6ea3ff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.count{font-size:12.5px;font-weight:500;color:var(--muted)}
.count.hot{color:var(--red-fg);background:var(--red);font-weight:600;border-radius:6px;padding:2px 9px}
.sp{flex:1}
.lb{font:inherit;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lb:hover{color:var(--fg)}
.lb.hot{color:var(--red);font-weight:600} .lb:disabled{text-decoration:none;cursor:default}
#board{display:flex;flex-direction:column;gap:10px}
h2{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
.grid{columns:13.5rem;column-gap:10px}
.tile{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 6px 6px;margin:0 0 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.name{font-weight:700;font-size:14px;letter-spacing:-.01em;color:var(--fg);text-decoration:none;padding:0 6px 4px;overflow-wrap:anywhere}
a.name:hover{text-decoration:underline;text-underline-offset:2px}
.t{display:flex;align-items:flex-start;gap:8px;padding:3px 6px;border-radius:6px;color:var(--fg2);text-decoration:none;min-width:0}
a.t:hover{background:var(--hover);color:var(--fg)}
.t .l{min-width:0;overflow-wrap:anywhere}
.t .m{flex:none;width:17px;height:17px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
.t .m::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--muted);opacity:.45;box-sizing:border-box}
.t.red{color:var(--fg);font-weight:600}
.t.red .m{background:var(--red);color:var(--red-fg)}
.t.red .m::before{content:none}
a.t.red:hover{background:var(--red-soft)}
span.t{opacity:.7}
.t:focus-visible,.name:focus-visible,.lb:focus-visible{outline:2px solid var(--dot);outline-offset:1px}
.none{color:var(--muted);padding:0 6px}
.bar{color:var(--fg);background:var(--red-soft);border-radius:8px;padding:6px 10px}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.notes div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.notes .un{color:var(--fg);font-weight:600}
.notes .none{padding:0}
.foot{color:var(--muted);font-size:12px;line-height:1.5;margin:0}
.foot a{color:inherit;text-underline-offset:2px}
.foot code{font-size:11.5px}
.key{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--red);vertical-align:-1px}
.key.on{width:7px;height:7px;border-radius:50%;background:var(--dot);vertical-align:1px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;user-select:all;margin:0}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <header><h1>Status Board</h1><span class="count" id="count"></span><span class="sp"></span><button class="lb" id="notesBtn" type="button">Notes</button></header>
  <div id="notes" class="notes" hidden></div>
  <div id="unmatched" class="bar" hidden></div>
  <div id="board" aria-live="polite"><p class="none">Loading…</p></div>
  <p class="foot"><span class="key"></span> waits on you. Start each session with <code>/board-status</code>. New machine: <a href="https://github.com/zwdzwd/status-board-mod#setting-up" target="_blank" rel="noopener">install the plugin</a>, then <button class="lb" id="skillBtn" type="button" disabled>copy the skill setup</button>. <span id="ver"></span></p>
  <div id="skillBox" hidden><p class="foot">Copying was blocked. Select and copy this:</p><pre id="skillText"></pre></div>
</div>

<script>
(function(){
  const VERSION = "0.15.0";   // one version for board, mod and rules; bump all together
  const SECTIONS = [{key:"paper", label:"Analysis"}, {key:"software", label:"Software"}, {key:"misc", label:"Misc"}];
  const CAT_ALIAS = {papers:"paper", research:"paper", tool:"software", tools:"software", code:"software",
    grant:"misc", grants:"misc", talk:"misc", talks:"misc", personal:"misc", other:"misc"};
  const catKey = c => { const k = String(c || "").toLowerCase().trim(); const a = CAT_ALIAS[k] || k; return SECTIONS.some(s => s.key === a) ? a : "paper"; };
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, ...kids) => { const n = document.createElement(tag);
    if (attrs) for (const k in attrs){ if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
    for (const k of kids) if (k != null) n.append(k); return n; };
  const arr = v => Array.isArray(v) ? v.filter(x => x != null && x !== "") : (v ? [v] : []);
  const safe = u => typeof u === "string" && /^https:\/\//.test(u);
  let projects = [], messages = [], dbRef = null, boardLink = "";

  // A thread is red when it waits on you: its status says so, or it still lists open items.
  // It is active (a small dot) while Claude is on a turn or background jobs run.
  const openAsks = t => arr(t.asks).filter(a => a && a.text && !a.done_at);
  const ended = t => t.ended && (!t.at || Date.parse(t.ended) >= Date.parse(t.at) - 1000);
  const isRed = t => /^(waiting|waiting_on_you|blocked|at_risk)$/.test(String(t.status || "")) || openAsks(t).length > 0;
  const isActive = t => !ended(t) && (t.status === "thinking" || arr(t.jobs).length > 0);
  const waitText = t => { const a = openAsks(t).map(x => String(x.text).replace(/^#\d+\s*/, "")); return a.length ? a.join("\n") : (typeof t.waiting === "string" ? t.waiting : ""); };

  function chip(t){
    const red = isRed(t), label = t.label || "Thread";
    const title = red ? "Waits on you" + (waitText(t) ? ":\n" + waitText(t) : "") : "Nothing needed";
    const cls = "t" + (red ? " red" : "");
    const kids = [el("span",{class:"m","aria-hidden":"true",}), el("span",{class:"l",text:label})];
    return safe(t.url) ? el("a",{class:cls,href:t.url,target:"_blank",rel:"noopener",title}, ...kids)
                       : el("span",{class:cls,title:title + " (no link yet)"}, ...kids);
  }
  // The project's threads view, taken from a thread link (https://claude.ai/code/project/<id>?thread=...).
  const projectUrl = p => { const m = arr(p.threads).map(t => /^(https:\/\/claude\.ai\/code\/project\/[A-Za-z0-9_-]+)\?thread=/.exec(String(t && t.url || ""))).find(Boolean); return m ? m[1] : (safe(p.url) ? p.url : ""); };

  function tile(p){
    const ths = arr(p.threads).filter(t => t && (safe(t.url) || t.label));
    const u = projectUrl(p), nm = p.name || p.id;
    const c = el("div",{class:"tile"}, u ? el("a",{class:"name",href:u,target:"_blank",rel:"noopener",title:"Open this project",text:nm}) : el("span",{class:"name",text:nm}));
    ths.forEach(t => c.append(chip(t)));
    if (!ths.length) c.append(el("span",{class:"none",text:"no threads"}));
    return c;
  }

  function render(){
    const b = $("board"); b.replaceChildren();
    const pr = {high:0, medium:1, low:2};
    if (!projects.length) b.append(el("p",{class:"none",text:"No projects yet."}));
    SECTIONS.forEach(sec => {
      const rows = projects.filter(p => catKey(p.category) === sec.key)
        .sort((a,b) => (pr[a.priority] ?? 1) - (pr[b.priority] ?? 1) || String(a.name||a.id).localeCompare(String(b.name||b.id), undefined, {sensitivity:"base"}));
      if (!rows.length) return;
      const g = el("div",{class:"grid"}); rows.forEach(p => g.append(tile(p)));
      b.append(el("h2",{text:sec.label}), g);
    });
    const n = projects.flatMap(p => arr(p.threads)).filter(t => t && isRed(t)).length;
    $("count").textContent = n ? n + " thread" + (n === 1 ? " waits" : "s wait") + " on you" : "Nothing waits on you";
    $("count").classList.toggle("hot", n > 0);
    $("ver").textContent = "v" + VERSION;
  }

  // Notes between projects: unread count on the button; the list opens on click.
  let notesOpen = false;
  try { notesOpen = localStorage.getItem("sb-notes") === "1"; } catch(e){}
  function renderNotes(){
    const live = messages.filter(m => !m.archived_at).sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
    const un = live.filter(m => !m.read_at), btn = $("notesBtn");
    btn.textContent = un.length ? "Notes · " + un.length + " unread" : "Notes";
    btn.classList.toggle("hot", un.length > 0);
    const box = $("notes"); box.hidden = !notesOpen; box.replaceChildren();
    if (!notesOpen) return;
    const pname = id => { const q = projects.find(x => x.id === id); return q ? (q.name || q.id) : id; };
    if (!live.length) box.append(el("div",{class:"none",text:"No notes."}));
    live.slice(0, 30).forEach(m => box.append(el("div",{class:m.read_at ? "" : "un",title:m.body || ""}, pname(m.from) + " → " + pname(m.to) + ": " + (m.subject || ""))));
    if (un.length){ const rd = el("button",{class:"lb",type:"button",text:"mark all read"});
      rd.onclick = async () => { const at = new Date().toISOString(); for (const m of un){ try { await dbRef.doc("messages/" + m.id).update({read_at: at}); } catch(e){} } };
      box.append(rd); }
  }
  function renderUnmatched(rows){
    const recent = rows.filter(r => r.at && Date.now() - Date.parse(r.at) < 24*3600000), box = $("unmatched");
    box.hidden = !recent.length;
    box.textContent = recent.length ? "Not on any card: " + recent.map(r => r.title || r.session || r.id).join(", ") : "";
  }
  function skillPrompt(link){
    return ['Set up my personal skill "board-skill" so every session knows where my Status Board is. Save it with exactly the content below. If a skill with that name exists and cannot be updated in place, remove it and save this one as new. If you cannot save skills in this session, show me the content so I can add it under Customize, Skills.',
      '', '---', 'name: board-skill', "description: Update this project's card on Wanding's Status Board, or find the board's address.", '---',
      '# Status Board', 'The Status Board is the artifact ' + link + '. Read and write it with the ArtifactData tool.',
      'Its rules are the "rules" field of collection meta, doc_id instruction. Read them first and',
      'follow them; they are the only description of the card format.',
      "To update this project's card, follow those rules and write only this project's card.",
      'If the board does not answer, tell the user in one line that the Status Board link in this', 'skill no longer works.'].join("\n");
  }
  $("skillBtn").onclick = async () => {
    if (!boardLink) return;
    const text = skillPrompt(boardLink);
    try { await navigator.clipboard.writeText(text); $("skillBtn").textContent = "copied"; setTimeout(() => $("skillBtn").textContent = "copy the skill setup", 1600); }
    catch (e) { $("skillText").textContent = text; $("skillBox").hidden = false; }
  };

  (async function start(){
    const db = await claude.use("db"); dbRef = db;
    if (!db){ $("board").replaceChildren(el("p",{class:"none",text:"Sign in to claude.ai to see your status board."})); return; }
    $("notesBtn").onclick = () => { notesOpen = !notesOpen; try { localStorage.setItem("sb-notes", notesOpen ? "1" : "0"); } catch(e){} renderNotes(); };
    db.collection("messages").onSnapshot(s => { messages = s.docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data())); renderNotes(); }, () => {});
    db.collection("unmatched").onSnapshot(s => renderUnmatched(s.docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data()))), () => {});
    db.collection("projects").onSnapshot(s => { projects = s.docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data())); render(); renderNotes(); },
      err => { $("board").replaceChildren(el("p",{class:"none",text:"The board couldn't load (" + (err && err.code || "error") + "). Reload to try again."})); });
    // The board's own link is kept in its data (meta/instruction.board): a page cannot read its own address.
    db.doc("meta/instruction").onSnapshot(s => { const d = s.exists ? s.data() : null;
      boardLink = d && typeof d.board === "string" && /^https:\/\/claude\.ai\/(code\/)?artifact\/[A-Za-z0-9-]+$/.test(d.board) ? d.board : "";
      $("skillBtn").disabled = !boardLink; }, () => {});
  })();
})();
</script>
