<title>Status Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a quiet ledger. Sections stack; inside each, project panels flow in newspaper columns in a stable
   order (priority, name). Each panel lists its threads one per line behind a square marker: solid red
   when the thread waits on you, a faint ring otherwise. Red is the only loud colour on the page. Hover a red line to see what it waits on. */
:root{
  --bg:#f2f3f6; --panel:#fff; --fg:#1a1e29; --fg2:#4a5163; --muted:#737a8c; --line:#e2e5ec; --hover:#eef0f5;
  --red:#cf2f27; --red-fg:#fff; --red-soft:#fdecea; --dot:#2b6fd6;
  --f:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1116; --panel:#171a22; --fg:#e7e9ef; --fg2:#b3b9c7; --muted:#858c9d; --line:#272b37; --hover:#1f232e;
  --red:#f05a4c; --red-fg:#fff; --red-soft:#3a1916; --dot:#6ea3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1116; --panel:#171a22; --fg:#e7e9ef; --fg2:#b3b9c7; --muted:#858c9d; --line:#272b37; --hover:#1f232e;
  --red:#f05a4c; --red-fg:#fff; --red-soft:#3a1916; --dot:#6ea3ff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.count{font-size:12.5px;font-weight:500;color:var(--muted)}
.count.hot{color:var(--red-fg);background:var(--red);font-weight:600;border-radius:6px;padding:2px 9px}
.sp{flex:1}
.lb{font:inherit;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lb:hover{color:var(--fg)}
.lb.hot{color:var(--red);font-weight:600} .lb:disabled{text-decoration:none;cursor:default}
#board{display:flex;flex-direction:column;gap:10px}
h2{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
.grid{columns:13.5rem;column-gap:10px}
.tile{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 6px 6px;margin:0 0 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.name{font-weight:700;font-size:14px;letter-spacing:-.01em;color:var(--fg);text-decoration:none;padding:0 6px 4px;overflow-wrap:anywhere}
a.name:hover{text-decoration:underline;text-underline-offset:2px}
.t{display:flex;align-items:flex-start;gap:8px;padding:3px 6px;border-radius:6px;color:var(--fg2);text-decoration:none;min-width:0}
a.t:hover{background:var(--hover);color:var(--fg)}
.t .l{min-width:0;overflow-wrap:anywhere}
.t .m{flex:none;width:17px;height:17px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
.t .m::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--muted);opacity:.45;box-sizing:border-box}
/* Recency: bold with a solid dot when active today, plain within 3 days, then fading. */
.t.a0{color:var(--fg);font-weight:600}
.t.a0 .m::before{background:var(--fg);border-color:var(--fg);opacity:1}
.t.a2{opacity:.6}
.t.a3{opacity:.35}
span.t{opacity:.7}
.t:focus-visible,.name:focus-visible,.lb:focus-visible{outline:2px solid var(--dot);outline-offset:1px}
.none{color:var(--muted);padding:0 6px}
.bar{color:var(--fg);background:var(--red-soft);border-radius:8px;padding:6px 10px}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.notes div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.notes .un{color:var(--fg);font-weight:600}
.notes .none{padding:0}
.foot{color:var(--muted);font-size:12px;line-height:1.5;margin:0}
.foot a{color:inherit;text-underline-offset:2px}
.foot code{font-size:11.5px}
.key{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--red);vertical-align:-1px}
.key.on{width:7px;height:7px;border-radius:50%;background:var(--dot);vertical-align:1px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;user-select:all;margin:0}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <header><h1>Status Board</h1><span class="count" id="count"></span><span class="sp"></span><button class="lb" id="notesBtn" type="button">Notes</button></header>
  <div id="notes" class="notes" hidden></div>
  <div id="unmatched" class="bar" hidden></div>
  <div id="board" aria-live="polite"><p class="none">Loading…</p></div>
  <p class="foot">Bold threads were active today; they fade after 3 days and again after a week. Start each session with <code>/board-status</code>. New machine: <a href="https://github.com/zwdzwd/status-board-mod#setting-up" target="_blank" rel="noopener">install the plugin</a>, then <button class="lb" id="skillBtn" type="button" disabled>copy the skill setup</button>. <span id="ver"></span></p>
  <div id="skillBox" hidden><p class="foot">Copying was blocked. Select and copy this:</p><pre id="skillText"></pre></div>
</div>

<script>
(function(){
  const VERSION = "0.15.2";   // one version for board, mod and rules; bump all together
  const SECTIONS = [{key:"paper", label:"Analysis"}, {key:"software", label:"Software"}, {key:"misc", label:"Misc"}];
  const CAT_ALIAS = {papers:"paper", research:"paper", tool:"software", tools:"software", code:"software",
    grant:"misc", grants:"misc", talk:"misc", talks:"misc", personal:"misc", other:"misc"};
  const catKey = c => { const k = String(c || "").toLowerCase().trim(); const a = CAT_ALIAS[k] || k; return SECTIONS.some(s => s.key === a) ? a : "paper"; };
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, ...kids) => { const n = document.createElement(tag);
    if (attrs) for (const k in attrs){ if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
    for (const k of kids) if (k != null) n.append(k); return n; };
  const arr = v => Array.isArray(v) ? v.filter(x => x != null && x !== "") : (v ? [v] : []);
  const safe = u => typeof u === "string" && /^https:\/\//.test(u);
  let projects = [], messages = [], dbRef = null, boardLink = "";
